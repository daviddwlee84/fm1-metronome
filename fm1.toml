# METRONOME's build settings (fm1-base tools/build.py)
name = "METRONOME"
title = "METRONOME"
id_prefix = "FM-1_59"          # package identity: dev FM-1_5900, release 0.1 FM-1_59000100 (no other package's in the Hub's catalog of 2026-11-19)
usb_manufacturer = "fm1-base"
usb_product = "METRONOME FM-1"
o2 = []
include = ["../common"]        # ledfx (firmware/common, MIT)
words = "words.tsv"
ble = false                    # USB only for now
tagline = "a stage metronome with a setlist on the keys"
repo = "https://github.com/daviddwlee84/M-VAVE_FM-1"
site = "https://daviddwlee84.github.io/M-VAVE_FM-1/dev/metronome/"
licence = "GPL-3.0-or-later"
credits = "Built on fm1-base by Charles Vestal. The click and the transport follow this repository's RHYTHM."
author = "daviddwlee84"
description = "A metronome for playing a set. SET: 16 songs on the white keys, each with its own tempo, meter, pattern and sound; a press switches song at the next bar. REC edits: pick a key, tap it for the tempo, or turn SELECT. K2 jumps between the tempo markings (LARGO to PRESTO), shown beside the BPM. Hold SEL to clear the set after a show. GRID: the bar's steps on the white keys, off, ghost, normal or accent, as bright as they sound; K3 sets a meter (6/8, 7/8 2+2+3...). CLASSIC: a rhythm-watch layout, four note layers mixed on K1-K4 and an accent every 1 to 9 beats."
tags = ["utility"]
